name: Test Sprites Auth

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Test Sprites authentication
        env:
          SPRITES_TOKEN: ${{ secrets.SPRITES_TOKEN }}
        run: |
          set -e

          echo "Testing Sprites API authentication..."

          curl -i \
            -H "Authorization: Bearer $SPRITES_TOKEN" \
            "https://api.sprites.dev/v1/sprites"
