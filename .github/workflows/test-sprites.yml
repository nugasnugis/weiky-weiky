name: Test Sprites Auth

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Install Sprites CLI
        run: |
          curl -fsSL https://sprites.dev/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Authenticate Sprites
        env:
          SPRITES_TOKEN: ${{ secrets.SPRITES_TOKEN }}
        run: |
          sprite auth setup --token "$SPRITES_TOKEN"

      - name: Test Sprite access
        run: |
          sprite list
