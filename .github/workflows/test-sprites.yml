name: Test Sprites Auth

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Check token format
      env:
        SPRITES_TOKEN: ${{ secrets.SPRITES_TOKEN }}
       run: |
         echo "Token length: ${#SPRITES_TOKEN}"
         echo "Slash count: $(printf '%s' "$SPRITES_TOKEN" | tr -cd '/' | wc -c)"
         echo "Starts with: $(printf '%s' "$SPRITES_TOKEN" | cut -c1-4)"
         echo "Ends with: $(printf '%s' "$SPRITES_TOKEN" | tail -c 5 | tr -c '\n' '*')"
